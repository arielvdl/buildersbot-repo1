# Docker starts the Builders Bot containers when it starts. `buildersbot-instance setup` installs this file as
# /etc/systemd/system/docker.service.d/buildersbot.conf.
[Unit]
# No container starts without its firewall: when buildersbot-firewall fails, Docker does not start.
Requires=buildersbot-firewall.service
After=buildersbot-firewall.service
# A container with the syslog log driver does not start without the rsyslog socket.
Wants=rsyslog.service
After=rsyslog.service
# A container with the LXCFS files of lxcfs.yaml does not start before LXCFS mounts them.
Wants=lxcfs.service
After=lxcfs.service
