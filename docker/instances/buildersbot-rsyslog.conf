# The container logs of the Builders Bot instances. `buildersbot-instance setup` installs it as
# /etc/rsyslog.d/30-buildersbot-docker.conf. See docs/docker.md#several-instances-on-one-host.
#
# Docker sends them to this socket and not to /dev/log, so they stay out of the journal and
# /var/log/syslog, whose size limits other services share. The AppArmor profile of rsyslogd permits a
# socket at /var/lib/*/dev/log. buildersbot-logrotate keeps the files for 30 days.
template(name="BuildersBotDockerFile" type="string" string="/var/log/buildersbot/%programname%.log")
template(name="BuildersBotDockerLine" type="string" string="%timegenerated:::date-rfc3339% %msg:2:$%\n")

ruleset(name="buildersbot-docker") {
  # The tag is the container name, which buildersbot-instance gives.
  if $programname startswith "buildersbot-" then {
    # setup makes /var/log/buildersbot for syslog, the user of rsyslogd.
    action(type="omfile" dynaFile="BuildersBotDockerFile" template="BuildersBotDockerLine" fileCreateMode="0640")
  }
  stop
}

input(type="imuxsock" socket="/var/lib/buildersbot-docker/dev/log" ruleset="buildersbot-docker" createPath="off")
